name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  n8n-nodes-franklab:
    name: Build, test, and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run tooling:ci
      - run: npm run build
      - run: npm test
      - run: npm run scan
